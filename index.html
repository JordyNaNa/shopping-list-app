<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <title>쇼핑 리스트</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1d2129;
      --muted: #6b7280;
      --border: #e3e6ea;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --danger: #dc2626;
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d;
        --surface: #1f2228;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --border: #30343b;
        --accent: #60a5fa;
        --accent-text: #0b1220;
        --danger: #f87171;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 8px 0 16px;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    #summary { margin: 0; color: var(--muted); font-size: 0.9rem; }

    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .add-form input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      font: inherit;
      font-size: 1rem; /* 16px 이상: iOS 자동 확대 방지 */
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: var(--radius);
      touch-action: manipulation;
    }
    .btn-primary {
      padding: 12px 18px;
      border: 0;
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 600;
      white-space: nowrap;
    }
    .btn-text {
      padding: 8px 10px;
      border: 0;
      background: transparent;
      color: var(--muted);
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .list:empty { display: none; }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 4px 4px 14px;
      min-height: 52px;
    }
    .item + .item { border-top: 1px solid var(--border); }

    .item label {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      cursor: pointer;
    }
    .item input[type="checkbox"] {
      flex: none;
      width: 22px;
      height: 22px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .item .name { overflow-wrap: anywhere; }
    .item.done .name {
      color: var(--muted);
      text-decoration: line-through;
    }

    .delete {
      flex: none;
      width: 44px;
      height: 44px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 1.25rem;
      line-height: 1;
    }
    @media (hover: hover) {
      .delete:hover { color: var(--danger); }
    }

    .empty {
      margin: 32px 0;
      text-align: center;
      color: var(--muted);
    }

    .footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>쇼핑 리스트</h1>
      <p id="summary" aria-live="polite"></p>
    </header>

    <form class="add-form" id="add-form" autocomplete="off">
      <label for="new-item" class="visually-hidden">추가할 아이템</label>
      <input id="new-item" name="item" type="text" placeholder="예: 우유" maxlength="100" required enterkeyhint="done">
      <button type="submit" class="btn-primary">추가</button>
    </form>

    <ul class="list" id="list"></ul>
    <p class="empty" id="empty">아직 아이템이 없어요. 위에서 추가해 보세요.</p>

    <div class="footer">
      <button type="button" class="btn-text" id="clear-done" hidden>구매 완료 항목 삭제</button>
    </div>
  </main>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'shopping-list:v1';

      const form = document.getElementById('add-form');
      const input = document.getElementById('new-item');
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      const summary = document.getElementById('summary');
      const clearDoneBtn = document.getElementById('clear-done');

      /** @type {{id: string, name: string, done: boolean}[]} */
      let items = load();

      function load() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) ?? '[]');
          if (!Array.isArray(parsed)) return [];
          return parsed.filter(it =>
            it && typeof it.id === 'string' && typeof it.name === 'string'
          ).map(it => ({ id: it.id, name: it.name, done: Boolean(it.done) }));
        } catch {
          return [];
        }
      }

      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        } catch {
          // 저장 공간 부족, 사생활 보호 모드 등: 메모리에서는 계속 동작
        }
      }

      function newId() {
        return globalThis.crypto?.randomUUID?.() ??
          `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
      }

      function render() {
        const fragment = document.createDocumentFragment();
        for (const item of items) {
          const li = document.createElement('li');
          li.className = 'item' + (item.done ? ' done' : '');
          li.dataset.id = item.id;

          const label = document.createElement('label');
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = item.done;
          checkbox.dataset.action = 'toggle';
          const name = document.createElement('span');
          name.className = 'name';
          name.textContent = item.name; // textContent로 XSS 방지
          label.append(checkbox, name);

          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'delete';
          del.dataset.action = 'delete';
          del.setAttribute('aria-label', `${item.name} 삭제`);
          del.textContent = '✕';

          li.append(label, del);
          fragment.append(li);
        }
        list.replaceChildren(fragment);

        const doneCount = items.filter(it => it.done).length;
        empty.hidden = items.length > 0;
        clearDoneBtn.hidden = doneCount === 0;
        summary.textContent = items.length
          ? `${doneCount} / ${items.length} 구매 완료`
          : '';
      }

      function update(mutator) {
        mutator();
        save();
        render();
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = input.value.trim();
        if (!name) {
          input.value = '';
          input.focus();
          return;
        }
        update(() => items.push({ id: newId(), name, done: false }));
        input.value = '';
        input.focus();
      });

      list.addEventListener('change', (e) => {
        if (e.target.dataset.action !== 'toggle') return;
        const id = e.target.closest('.item').dataset.id;
        update(() => {
          const item = items.find(it => it.id === id);
          if (item) item.done = e.target.checked;
        });
      });

      list.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action="delete"]');
        if (!btn) return;
        const li = btn.closest('.item');
        const id = li.dataset.id;
        // 삭제 후 포커스를 다음(또는 이전) 항목으로 이동
        const neighborId = (li.nextElementSibling ?? li.previousElementSibling)?.dataset.id;
        update(() => { items = items.filter(it => it.id !== id); });
        const target = neighborId
          ? list.querySelector(`[data-id="${CSS.escape(neighborId)}"] .delete`)
          : input;
        target?.focus();
      });

      clearDoneBtn.addEventListener('click', () => {
        update(() => { items = items.filter(it => !it.done); });
        input.focus();
      });

      // 다른 탭에서 변경 시 동기화
      window.addEventListener('storage', (e) => {
        if (e.key !== STORAGE_KEY) return;
        items = load();
        render();
      });

      render();
    })();
  </script>
</body>
</html>
