<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <title>쇼핑 리스트</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1d2129;
      --muted: #6b7280;
      --border: #e3e6ea;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --danger: #dc2626;
      --radius: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d;
        --surface: #1f2228;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --border: #30343b;
        --accent: #60a5fa;
        --accent-text: #0b1220;
        --danger: #f87171;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin: 8px 0 16px;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    #summary { margin: 0; color: var(--muted); font-size: 0.9rem; }

    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .add-form input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      font: inherit;
      font-size: 1rem; /* 16px 이상: iOS 자동 확대 방지 */
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: var(--radius);
      touch-action: manipulation;
    }
    .btn-primary {
      padding: 12px 18px;
      border: 0;
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 600;
      white-space: nowrap;
    }
    .btn-text {
      padding: 8px 10px;
      border: 0;
      background: transparent;
      color: var(--muted);
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .list {
      list-style: none;
      margin: 0;
      padding: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .list:empty { display: none; }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 4px 4px 14px;
      min-height: 52px;
    }
    .item + .item { border-top: 1px solid var(--border); }

    .item label {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      cursor: pointer;
    }
    .item input[type="checkbox"] {
      flex: none;
      width: 22px;
      height: 22px;
      margin: 0;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .item .name { overflow-wrap: anywhere; }
    .item.done .name {
      color: var(--muted);
      text-decoration: line-through;
    }

    .delete {
      flex: none;
      width: 44px;
      height: 44px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 1.25rem;
      line-height: 1;
    }
    @media (hover: hover) {
      .delete:hover { color: var(--danger); }
    }

    .empty {
      margin: 32px 0;
      text-align: center;
      color: var(--muted);
    }

    .status {
      margin: -8px 0 16px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .status:empty { display: none; }
    .status.error { color: var(--danger); }

    .footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 8px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>쇼핑 리스트</h1>
      <p id="summary" aria-live="polite"></p>
    </header>

    <form class="add-form" id="add-form" autocomplete="off">
      <label for="new-item" class="visually-hidden">추가할 아이템</label>
      <input id="new-item" name="item" type="text" placeholder="예: 우유" maxlength="100" required enterkeyhint="done">
      <button type="submit" class="btn-primary">추가</button>
    </form>

    <p class="status" id="status" role="status"></p>

    <ul class="list" id="list"></ul>
    <p class="empty" id="empty">아직 아이템이 없어요. 위에서 추가해 보세요.</p>

    <div class="footer">
      <button type="button" class="btn-text" id="clear-done" hidden>구매 완료 항목 삭제</button>
    </div>
  </main>

  <script>
    (() => {
      'use strict';

      // 공개(publishable) 키만 사용한다. 권한은 DB의 RLS 정책으로 제한된다.
      // 서비스(secret) 키는 절대 이 파일에 넣지 않는다.
      const SUPABASE_URL = 'https://fcsvpmkfssoydajrnymx.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_NWlCtBEnbh5TjFjpcQmONQ_nvWs3uVS';
      const TABLE_URL = `${SUPABASE_URL}/rest/v1/shopping_items`;

      const form = document.getElementById('add-form');
      const input = document.getElementById('new-item');
      const list = document.getElementById('list');
      const empty = document.getElementById('empty');
      const summary = document.getElementById('summary');
      const status = document.getElementById('status');
      const clearDoneBtn = document.getElementById('clear-done');

      /** @type {{id: string, name: string, done: boolean}[]} */
      let items = [];
      let loaded = false;      // 첫 로드 완료 여부 (빈 상태 문구 표시용)
      let pending = 0;         // 진행 중인 서버 쓰기 수
      let staleRefresh = false; // 쓰기 중에 받은 로드 결과를 버렸는지
      let writeQueue = Promise.resolve();

      async function api(method, query = '', body) {
        const res = await fetch(`${TABLE_URL}${query}`, {
          method,
          headers: {
            apikey: SUPABASE_KEY,
            'Content-Type': 'application/json',
            Prefer: 'return=minimal',
          },
          body: body === undefined ? undefined : JSON.stringify(body),
        });
        if (!res.ok) throw new Error(`${method} ${res.status}`);
        return res.status === 204 || res.headers.get('content-length') === '0'
          ? null
          : res.json().catch(() => null);
      }

      function setStatus(text, isError = false) {
        status.textContent = text;
        status.classList.toggle('error', isError);
      }

      async function load() {
        const rows = await api('GET', '?select=id,name,done&order=created_at.asc,id.asc');
        if (!Array.isArray(rows)) return [];
        return rows.filter(it =>
          it && typeof it.id === 'string' && typeof it.name === 'string'
        ).map(it => ({ id: it.id, name: it.name, done: Boolean(it.done) }));
      }

      // 서버 상태로 다시 그린다. 쓰기 진행 중이면 낙관적 상태를 덮지 않도록 미룬다.
      async function refresh() {
        try {
          const fresh = await load();
          if (pending > 0) { staleRefresh = true; return; }
          items = fresh;
          loaded = true;
          setStatus('');
          render();
        } catch {
          setStatus('서버에서 목록을 불러오지 못했어요. 연결을 확인해 주세요.', true);
        }
      }

      function newId() {
        if (globalThis.crypto?.randomUUID) return crypto.randomUUID();
        // randomUUID는 보안 컨텍스트에서만 제공되므로 UUID v4를 직접 만든다
        const b = crypto.getRandomValues(new Uint8Array(16));
        b[6] = (b[6] & 0x0f) | 0x40;
        b[8] = (b[8] & 0x3f) | 0x80;
        const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
        return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
      }

      function render() {
        const fragment = document.createDocumentFragment();
        for (const item of items) {
          const li = document.createElement('li');
          li.className = 'item' + (item.done ? ' done' : '');
          li.dataset.id = item.id;

          const label = document.createElement('label');
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = item.done;
          checkbox.dataset.action = 'toggle';
          const name = document.createElement('span');
          name.className = 'name';
          name.textContent = item.name; // textContent로 XSS 방지
          label.append(checkbox, name);

          const del = document.createElement('button');
          del.type = 'button';
          del.className = 'delete';
          del.dataset.action = 'delete';
          del.setAttribute('aria-label', `${item.name} 삭제`);
          del.textContent = '✕';

          li.append(label, del);
          fragment.append(li);
        }
        list.replaceChildren(fragment);

        const doneCount = items.filter(it => it.done).length;
        empty.hidden = !loaded || items.length > 0;
        clearDoneBtn.hidden = doneCount === 0;
        summary.textContent = items.length
          ? `${doneCount} / ${items.length} 구매 완료`
          : '';
      }

      // 낙관적 업데이트: 화면을 먼저 바꾸고 서버에 반영한다.
      // 실패하면 서버 상태를 다시 불러와 화면을 되돌린다.
      async function update(mutator, persist) {
        mutator();
        render();
        pending++;
        // 쓰기는 순서대로 하나씩 보낸다 (추가 순서/연속 토글이 서버에서 뒤섞이지 않게)
        const run = writeQueue.then(persist);
        writeQueue = run.catch(() => {});
        try {
          await run;
        } catch {
          staleRefresh = true;
          setStatus('저장하지 못했어요. 서버의 목록으로 되돌렸어요.', true);
        } finally {
          pending--;
          if (pending === 0 && staleRefresh) {
            staleRefresh = false;
            const errorText = status.classList.contains('error') ? status.textContent : '';
            await refresh();
            if (errorText) setStatus(errorText, true);
          }
        }
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = input.value.trim();
        if (!name) {
          input.value = '';
          input.focus();
          return;
        }
        const item = { id: newId(), name, done: false };
        update(() => items.push(item), () => api('POST', '', item));
        input.value = '';
        input.focus();
      });

      list.addEventListener('change', (e) => {
        if (e.target.dataset.action !== 'toggle') return;
        const id = e.target.closest('.item').dataset.id;
        const done = e.target.checked;
        update(() => {
          const item = items.find(it => it.id === id);
          if (item) item.done = done;
        }, () => api('PATCH', `?id=eq.${encodeURIComponent(id)}`, { done }));
      });

      list.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action="delete"]');
        if (!btn) return;
        const li = btn.closest('.item');
        const id = li.dataset.id;
        // 삭제 후 포커스를 다음(또는 이전) 항목으로 이동
        const neighborId = (li.nextElementSibling ?? li.previousElementSibling)?.dataset.id;
        update(
          () => { items = items.filter(it => it.id !== id); },
          () => api('DELETE', `?id=eq.${encodeURIComponent(id)}`),
        );
        const target = neighborId
          ? list.querySelector(`[data-id="${CSS.escape(neighborId)}"] .delete`)
          : input;
        target?.focus();
      });

      clearDoneBtn.addEventListener('click', () => {
        const doneIds = items.filter(it => it.done).map(it => it.id);
        if (doneIds.length === 0) return;
        update(
          () => { items = items.filter(it => !it.done); },
          () => api('DELETE', `?id=in.(${doneIds.map(encodeURIComponent).join(',')})`),
        );
        input.focus();
      });

      // 다른 탭/기기의 변경 반영: 화면으로 돌아올 때 서버에서 다시 불러온다
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') refresh();
      });

      setStatus('불러오는 중…');
      render();
      refresh();
    })();
  </script>
</body>
</html>
